<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fingertip Garden</title>

  <!-- Google Font for the dreamy italic serif quote -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&display=swap" rel="stylesheet">

  <!-- MediaPipe Hands & Camera Utilities -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <!-- Tone.js Audio Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background-color: #111111;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .controls {
      display: flex;
      gap: 12px;
      margin-bottom: 14px;
      z-index: 10;
    }

    button {
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    button:hover {
      transform: scale(1.04);
    }

    #start-btn {
      background-color: #f8c8dc;
      color: #1a1a1a;
    }

    #clear-btn {
      background-color: rgba(255, 255, 255, 0.15);
      color: #ffffff;
      backdrop-filter: blur(6px);
    }

    .stage {
      position: relative;
      width: 800px;
      height: 540px;
      max-width: 95vw;
      aspect-ratio: 800 / 540;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      background: #000;
    }

    /* Webcam video is mirrored horizontally */
    #webcam {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      filter: contrast(1.03) saturate(1.05) brightness(0.96);
    }

    /* Canvas sits directly on top (NOT mirrored via CSS so emojis render right-side-up) */
    #output_canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* Dreamy italic quote overlay matching reference video */
    .quote-overlay {
      position: absolute;
      top: 22%;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      text-align: center;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-style: italic;
      font-size: 26px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.92);
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.45);
      pointer-events: none;
      letter-spacing: 0.3px;
      opacity: 0;
      transition: opacity 1.2s ease;
    }

    .quote-overlay.visible {
      opacity: 1;
    }
  </style>
</head>
<body>

  <div class="controls">
    <button id="start-btn">Start Garden & Sound</button>
    <button id="clear-btn">Clear Garden</button>
  </div>

  <div class="stage">
    <video id="webcam" autoplay playsinline></video>
    <canvas id="output_canvas" width="800" height="540"></canvas>
    <div id="quote" class="quote-overlay">just a little thoughtful garden you can tend to.</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
